{% extends 'base.html' %}{% block content %}<section class="auth-card"><div class="eyebrow">STUDENT ACCOUNT</div><h1>Create account</h1><p>Register with your institution details to access assigned TESTS.</p><form id="registerForm"><label>Full name<input name="full_name" required minlength="2"></label><label>Email address<input name="email" type="email" required></label><label>Matric number<input name="matric_number" required></label><label>Password<input name="password" type="password" required minlength="10"></label><button class="btn primary">Create student account</button><div id="message" class="message"></div></form><p><a href="/login">Already registered? Sign in</a></p></section>{% endblock %}{% block scripts %}<script>
document.querySelector('#registerForm').addEventListener('submit',async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));body.role='student';const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){document.querySelector('#message').textContent=d.detail||'Registration failed';return;}document.querySelector('#message').textContent='Account created. You can now sign in.';e.target.reset();});
</script>{% endblock %}
