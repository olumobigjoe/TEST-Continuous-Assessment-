{% extends 'base.html' %}{% block content %}<section class="auth-card"><div class="eyebrow">WELCOME BACK</div><h1>Sign in</h1><p>Access your TEST Management workspace.</p><form id="loginForm"><label>Email address<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">Sign in</button><div id="message" class="message"></div></form><p><a href="/register">Create a student account</a></p></section>{% endblock %}{% block scripts %}<script>
document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(!r.ok){document.querySelector('#message').textContent=d.detail||'Unable to sign in';return;}location.href=d.user.role==='student'?'/student':'/dashboard';});
</script>{% endblock %}
